[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fls"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[project.scripts]
fls-upload = "fls.upload:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/fls"]
